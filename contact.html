<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Laurenz Cultura — Send a message to discuss web development, mobile apps, or UI/UX design projects.">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Mac Laurenz Cultura | Contact</title>
</head>

<body>
    <!-- Scroll Progress Bar -->
    <div id="scroll-progress"></div>

    <!-- Navigation -->
    <nav>
        <div class="logo">
            Laurenz <span>Cultura</span>
        </div>
        <div class="nav-container">
            <div class="links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="tech-stack.html">Tech Stack</a>
                <a href="services.html">Services</a>
                <a href="certifications.html">Certifications</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
        <i class="fa-solid fa-bars hamburg" onclick="toggleMenu()"></i>
        <div class="dropdown">
            <div class="links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="tech-stack.html">Tech Stack</a>
                <a href="services.html">Services</a>
                <a href="certifications.html">Certifications</a>
                <a href="contact.html">Contact</a>
                <i class="fa-solid fa-xmark cancel" onclick="toggleMenu()"></i>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <!-- Contact Section -->
        <section id="contact">
            <h2 data-aos="fade-up" data-aos-duration="1500">Contact</h2>
            <p style="text-align: center; color: var(--text-muted); margin-top: -2rem; margin-bottom: 2rem;"
                data-aos="fade-up" data-aos-delay="100">
                Have a project in mind? I'd love to hear from you.
            </p>
            <!--
                To make this form actually send emails:
                1. Go to https://formspree.io and create a free account
                2. Create a new form and get your form endpoint
                3. Replace "YOUR_FORMSPREE_ID" below with your actual form ID
                   e.g. action="https://formspree.io/f/abcdefgh"
            -->
            <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST"
                data-aos="fade-up" data-aos-duration="1500" data-aos-delay="200" id="contact-form">
                <input type="text" name="name" id="contact-name" placeholder="Your Name" required>
                <input type="email" name="email" id="contact-email" placeholder="Your Email" required>
                <textarea name="message" id="contact-message" placeholder="Your Message" required></textarea>
                <button type="submit" id="contact-submit">
                    <i class="fa-solid fa-paper-plane"></i> Send Message
                </button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; <span class="footer-year"></span> Laurenz Cultura. All rights reserved.</p>
    </footer>

    <!-- Back to Top -->
    <button id="back-to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

    <!-- Scripts -->
    <script src="assets/js/script.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        AOS.init({ offset: 0, duration: 1000 });

        document.getElementById('contact-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn = document.getElementById('contact-submit');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

            const formData = new FormData(this);
            const action = this.getAttribute('action');

            // If Formspree ID hasn't been set yet, fall back to success popup only
            if (action.includes('YOUR_FORMSPREE_ID')) {
                // Demo mode: show success without actually sending
                await new Promise(r => setTimeout(r, 800));
                Swal.fire({
                    title: 'Message Sent!',
                    text: 'Thank you for reaching out. I will get back to you soon.',
                    icon: 'success',
                    confirmButtonText: 'OK',
                    confirmButtonColor: '#8b5cf6'
                });
                this.reset();
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Message';
                return;
            }

            try {
                const response = await fetch(action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    Swal.fire({
                        title: 'Message Sent!',
                        text: 'Thank you for reaching out. I will get back to you soon.',
                        icon: 'success',
                        confirmButtonText: 'OK',
                        confirmButtonColor: '#8b5cf6'
                    });
                    this.reset();
                } else {
                    throw new Error('Network error');
                }
            } catch {
                Swal.fire({
                    title: 'Oops!',
                    text: 'Something went wrong. Please try emailing me directly.',
                    icon: 'error',
                    confirmButtonText: 'OK',
                    confirmButtonColor: '#8b5cf6'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Message';
            }
        });
    </script>
</body>

</html>
